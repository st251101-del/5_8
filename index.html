<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sacabambaspis Eater</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Montserrat', 'Noto Sans JP', sans-serif;
    }
    body {
      font-family: var(--font-main);
      -webkit-tap-highlight-color: transparent;
    }
    
    /* 深海のゆらぎ背景 */
    .water-bg {
      background: radial-gradient(circle at 50% 30%, rgba(14, 165, 233, 0.15) 0%, transparent 70%),
                  linear-gradient(180deg, #020617 0%, #0f172a 50%, #020617 100%);
    }

    /* サカバンバスピスの基本スタイル */
    .saca {
      position: absolute;
      will-change: transform;
    }

    /* パーティクルエフェクト */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pop {
      0% { transform: scale(1) translate(0, 0); opacity: 1; }
      100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; }
    }

    /* 泡のアニメーション */
    .bubble {
      position: absolute;
      bottom: -20px;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      pointer-events: none;
      animation: rise linear infinite;
    }

    @keyframes rise {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(var(--drift)); opacity: 0; }
    }

    /* 浮遊アニメーション（タイトル画面用） */
    .animate-float-saca {
      animation: floatSaca 4s ease-in-out infinite;
    }

    @keyframes floatSaca {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-10px) rotate(3deg); }
      75% { transform: translateY(10px) rotate(-3deg); }
    }

    /* テキストアニメーション */
    .pop-text {
      transition: transform 0.1s;
    }

    /* プログレスバーと演出用スタイル */
    .progress-container {
      width: 100%;
      height: 24px;
      background-color: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      border: 2px solid #06b6d4;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      width: 30%;
      transition: width 0.2s ease-out, background-color 0.3s;
    }
    .progress-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 900;
      color: white;
      text-shadow: 0px 1px 3px rgba(0,0,0,0.8);
    }
    .warning-bg {
      animation: pulse-red 1s infinite;
    }
    @keyframes pulse-red {
      0%, 100% { background-color: rgba(239, 68, 68, 0); }
      50% { background-color: rgba(239, 68, 68, 0.25); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden w-screen h-screen touch-none select-none relative">
  <div id="warning-overlay" class="absolute inset-0 z-0 pointer-events-none transition-colors duration-300"></div>
  
  <!-- 背景エフェクト -->
  <div class="water-bg absolute inset-0 z-0"></div>
  <div id="bg-bubbles" class="absolute inset-0 z-0 overflow-hidden"></div>

  <!-- ゲームオブジェクト格納領域 -->
  <div id="game-container" class="absolute inset-0 z-10 overflow-hidden"></div>
  <div id="particle-container" class="absolute inset-0 z-20 pointer-events-none overflow-hidden"></div>

  <!-- HUD (ヘッドアップディスプレイ) -->
  <div id="hud" class="absolute top-0 left-0 w-full p-6 md:p-8 flex flex-col items-center z-30 hidden pointer-events-none">
    <div class="flex justify-between w-full max-w-2xl items-end mb-2">
      <span class="text-cyan-500 text-xs md:text-sm font-bold tracking-widest uppercase drop-shadow-md">満腹度ゲージ</span>
      <span id="wave-display" class="text-yellow-400 text-sm md:text-lg font-black tracking-widest uppercase drop-shadow-md">ウェーブ 1</span>
    </div>
    <div class="progress-container max-w-2xl">
      <div id="fullness-bar" class="progress-bar" style="width: 30%;"></div>
      <div id="fullness-text" class="progress-text">30%</div>
    </div>
    <span id="combo-display" class="pop-text text-lg md:text-xl font-bold text-yellow-400 opacity-0 mt-2 drop-shadow-md">0 連続捕食！</span>
  </div>

  <!-- ボスHP表示 -->
  <div id="boss-hud" class="absolute top-24 left-0 w-full p-6 flex flex-col items-center z-30 hidden pointer-events-none">
    <span class="text-red-500 text-sm md:text-base font-black tracking-widest uppercase mb-2 drop-shadow-[0_0_5px_rgba(239,68,68,0.8)] animate-pulse">巨大ヌシバンバスピス</span>
    <div class="progress-container max-w-xl h-4 border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.5)]">
      <div id="boss-hp-bar" class="progress-bar" style="background: linear-gradient(90deg, #dc2626, #f87171); width: 100%; transition: width 0.1s;"></div>
    </div>
  </div>

  <!-- カウントダウン表示 -->
  <div id="countdown-display" class="absolute inset-0 z-40 flex items-center justify-center text-8xl md:text-9xl font-black text-white drop-shadow-[0_0_30px_rgba(6,182,212,0.8)] hidden pointer-events-none"></div>

  <!-- スキル選択画面 -->
  <div id="skill-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center backdrop-blur-md bg-slate-950/80 hidden">
    <h2 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-2 drop-shadow-[0_0_10px_rgba(250,204,21,0.5)]">
      進化の選択
    </h2>
    <p class="text-slate-300 mb-8 font-bold">ヌシを討伐した！新たな深海能力を1つ獲得せよ。</p>
    <div class="flex flex-col md:flex-row gap-4 max-w-4xl w-full px-6" id="skill-cards">
      <!-- JSで動的に生成 -->
    </div>
  </div>

  <!-- スタート画面 -->
  <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center backdrop-blur-sm bg-slate-950/60">
    <div class="flex flex-col items-center bg-slate-900/90 p-8 md:p-12 rounded-[2rem] border border-slate-700/50 shadow-2xl max-w-xl text-center">
      <h1 class="text-4xl md:text-6xl font-black mb-4 tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-500 drop-shadow-lg leading-tight">
        深海の目覚め
      </h1>
      <p class="text-slate-300 mb-8 text-sm md:text-base font-medium leading-relaxed">
        長き眠りから覚めた深海の覇者であるあなたを、猛烈な空腹が襲う。<br>
        画面を<strong class="text-yellow-400">なぞる（スワイプ）</strong>だけでサカバンバスピスを連続捕食！<br>
        <strong class="text-cyan-400 text-lg">満腹度を100%</strong>にしてヌシを引きずり出せ！
      </p>
      
      <div class="animate-float-saca mb-8">
        <div class="flex items-center justify-center w-20 h-20 md:w-28 md:h-28 rounded-full bg-slate-800 text-slate-200 border-4 border-cyan-500 shadow-[0_0_40px_rgba(6,182,212,0.4)]">
          <span class="text-2xl md:text-3xl font-black tracking-widest drop-shadow-md">◉▼◉</span>
        </div>
      </div>

      <div class="flex gap-6 text-xs md:text-sm text-slate-400 mb-8 text-center font-bold">
        <div class="flex flex-col items-center"><span class="text-lg">◉▼◉</span><span class="text-cyan-400 mt-1">回復 (小)</span></div>
        <div class="flex flex-col items-center"><span class="text-lg text-yellow-400">◉▽◉</span><span class="text-yellow-400 mt-1">回復 (大)</span></div>
        <div class="flex flex-col items-center"><span class="text-lg text-red-400">◉皿◉</span><span class="text-red-400 mt-1">毒 (満腹度減)</span></div>
      </div>

      <button id="btn-start" class="px-10 py-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black rounded-full transition-all duration-300 shadow-[0_0_20px_rgba(6,182,212,0.6)] hover:shadow-[0_0_40px_rgba(6,182,212,0.9)] hover:scale-105 active:scale-95 text-xl tracking-widest">
        捕食開始 (PLAY)
      </button>
    </div>
  </div>

  <!-- リザルト画面 -->
  <div id="result-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center backdrop-blur-md bg-slate-950/90 hidden">
    <div class="flex flex-col items-center text-center max-w-2xl px-6">
      <p id="result-subtitle" class="text-cyan-500 font-bold tracking-widest uppercase mb-2">最終結果</p>
      <h2 id="result-title" class="text-5xl md:text-7xl font-black text-white mb-6 drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]">-</h2>
      
      <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-700/50 mb-10">
        <p id="result-story" class="text-slate-300 text-sm md:text-base leading-relaxed font-medium">
          -
        </p>
      </div>

      <button id="btn-retry" class="px-10 py-4 bg-transparent border-2 border-cyan-500 text-cyan-400 hover:bg-cyan-500 hover:text-slate-950 font-black rounded-full transition-all duration-300 shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] hover:scale-105 active:scale-95 text-xl tracking-widest">
        もう一度最初からプレイ
      </button>
    </div>
  </div>

  <script>
    // --- 状態管理 ---
    let gameState = 'start'; // start, playing, boss, skillSelect, end
    let fullness = 30.0; // 満腹度 (0 - 100)
    let combo = 0;
    let wave = 1;
    let sacas = [];
    let lastTime = 0;
    let spawnTimeout = null;
    let gameLoopId = null;
    let bossHp = 100;
    let bossAttackTimeout = null;
    let isDragging = false;

    // --- スキル管理 ---
    let skills = {
      magnet: 0,      // 吸引力アップ（捕食判定拡大）
      digestion: 0,   // 消化器官強化（満腹度減少速度低下）
      luck: 0,        // 黄金の嗅覚（金サカ率アップ）
      immunity: 0     // 毒耐性（毒ダメージ軽減）
    };
    
    const skillData = {
      magnet: { name: "吸引力アップ", desc: "なぞった時の捕食判定範囲が大きくなります", icon: "◎" },
      digestion: { name: "消化器官強化", desc: "時間経過によるお腹の減り（満腹度減少）が遅くなります", icon: "♥" },
      luck: { name: "黄金の嗅覚", desc: "回復量の多い「金サカバンバスピス」が少し出やすくなります", icon: "★" },
      immunity: { name: "毒耐性", desc: "毒サカバンバスピスを食べた時のダメージが減少します", icon: "🛡️" }
    };

    // --- DOM要素 ---
    const dom = {
      waterBg: document.querySelector('.water-bg'),
      startScreen: document.getElementById('start-screen'),
      resultScreen: document.getElementById('result-screen'),
      skillScreen: document.getElementById('skill-screen'),
      skillCards: document.getElementById('skill-cards'),
      hud: document.getElementById('hud'),
      waveDisplay: document.getElementById('wave-display'),
      bossHud: document.getElementById('boss-hud'),
      bossHpBar: document.getElementById('boss-hp-bar'),
      countdown: document.getElementById('countdown-display'),
      fullnessBar: document.getElementById('fullness-bar'),
      fullnessText: document.getElementById('fullness-text'),
      combo: document.getElementById('combo-display'),
      warningOverlay: document.getElementById('warning-overlay'),
      gameContainer: document.getElementById('game-container'),
      particleContainer: document.getElementById('particle-container'),
      btnStart: document.getElementById('btn-start'),
      btnRetry: document.getElementById('btn-retry'),
      resultSubtitle: document.getElementById('result-subtitle'),
      resultTitle: document.getElementById('result-title'),
      resultStory: document.getElementById('result-story'),
    };

    // --- 座標取得ユーティリティ ---
    function getPointerPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX || 0, y: e.clientY || 0 };
    }

    // --- 背景の泡生成 ---
    function initBubbles() {
      const container = document.getElementById('bg-bubbles');
      for (let i = 0; i < 25; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const size = Math.random() * 15 + 5;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.random() * 100}%`;
        bubble.style.animationDuration = `${Math.random() * 8 + 4}s`;
        bubble.style.animationDelay = `${Math.random() * 5}s`;
        bubble.style.setProperty('--drift', `${(Math.random() - 0.5) * 150}px`);
        container.appendChild(bubble);
      }
    }

    // --- ゲーム制御 ---
    function startGameSequence() {
      dom.startScreen.classList.add('hidden');
      dom.resultScreen.classList.add('hidden');
      dom.countdown.classList.remove('hidden');
      
      let count = 3;
      
      const animateCount = () => {
        dom.countdown.style.transition = 'none';
        dom.countdown.style.transform = 'scale(0.5)';
        dom.countdown.style.opacity = '0';
        
        setTimeout(() => {
          dom.countdown.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s';
          dom.countdown.style.transform = 'scale(1)';
          dom.countdown.style.opacity = '1';
          
          if (count > 0) {
            dom.countdown.textContent = count;
          } else if (count === 0) {
            dom.countdown.textContent = 'GO!';
            dom.countdown.classList.add('text-cyan-400');
          } else {
            dom.countdown.classList.add('hidden');
            dom.countdown.classList.remove('text-cyan-400');
            startPlaying(true); // 初回・リトライ時はパラメータリセット
            return;
          }
          
          count--;
          setTimeout(animateCount, 800);
        }, 50);
      };
      
      animateCount();
    }

    function startPlaying(isReset = false) {
      if (isReset) {
        wave = 1;
        skills = { magnet: 0, digestion: 0, luck: 0, immunity: 0 };
        fullness = 30.0; 
      } else {
        // 次のウェーブへ（スキル取得後）
        fullness = 100.0; // ウェーブ開始時は満腹状態
      }
      
      dom.waveDisplay.textContent = `ウェーブ ${wave}`;
      combo = 0;
      sacas.forEach(s => { if (s.el.parentNode) s.el.remove(); });
      sacas = [];
      gameState = 'playing';
      
      updateHUD();
      dom.hud.classList.remove('hidden');
      dom.warningOverlay.classList.remove('warning-bg');
      
      lastTime = performance.now();
      cancelAnimationFrame(gameLoopId);
      gameLoopId = requestAnimationFrame(gameLoop);
      clearTimeout(spawnTimeout);
      scheduleSpawn();
    }

    // ゲームオーバー処理
    function endGame() {
      gameState = 'end';
      cancelAnimationFrame(gameLoopId);
      clearTimeout(spawnTimeout);
      clearTimeout(bossAttackTimeout);
      
      const bossEl = document.getElementById('boss-saca');
      if (bossEl) bossEl.remove();
      dom.waterBg.style.background = ''; // 背景を元に戻す
      
      dom.hud.classList.add('hidden');
      dom.bossHud.classList.add('hidden');
      dom.warningOverlay.classList.remove('warning-bg');
      dom.resultScreen.classList.remove('hidden');
      
      dom.resultSubtitle.textContent = "ゲームオーバー";
      dom.resultSubtitle.className = "text-red-500 font-bold tracking-widest uppercase mb-2";
      dom.resultTitle.textContent = "餓死しました";
      dom.resultTitle.className = "text-5xl md:text-7xl font-black text-white mb-6 drop-shadow-[0_0_20px_rgba(239,68,68,0.5)]";
      dom.resultStory.innerHTML = `到達したウェーブ数: <strong class="text-yellow-400 text-2xl">${wave}</strong><br><br>空腹に耐えきれず、あなたは再び果てしない眠りについた...<br>深海の底で、次の目覚めを待つ。`;
    }

    // --- サカバンバスピス管理 ---
    function scheduleSpawn() {
      if (gameState !== 'playing' && gameState !== 'boss') return;
      
      spawnSaca();
      
      // 満腹度が低い＆ウェーブが進むほど敵が多く出る
      const rate = Math.max(80, 200 + fullness * 4 - (wave - 1) * 20);
      spawnTimeout = setTimeout(scheduleSpawn, rate);
    }

    function spawnSaca(isBossAttack = false) {
      const size = window.innerWidth < 768 ? 60 : 72;
      const typeRoll = Math.random();
      let type = 'normal';
      let face = '◉▼◉';
      let colorClass = 'bg-slate-800 border-slate-600 text-slate-200';
      let shadowClass = 'shadow-[0_0_15px_rgba(0,0,0,0.5)]';
      let points = 5; // 通常回復量
      
      // ウェーブが進むと全体的にスピードアップ
      let speedMult = 1 + (wave - 1) * 0.15;

      let baseX = Math.random() * (window.innerWidth - size);
      let baseY = window.innerHeight + size;
      let speedY = (Math.random() * 5 + 3) * speedMult * (window.innerHeight / 800);

      // スキルとウェーブによる出現率の計算
      const goldRate = 0.05 + skills.luck * 0.03; // luckスキルで金サカ増加
      const poisonRate = Math.min(0.5, 0.30 + (wave - 1) * 0.03); // WAVEで毒増加(最大50%)

      if (isBossAttack) {
        // ボスからの攻撃（毒確定）
        type = 'poison'; face = '◉皿◉'; speedMult = 1.3 + (wave - 1) * 0.1;
        colorClass = 'bg-red-500/20 border-red-500 text-red-400 backdrop-blur-sm';
        shadowClass = 'shadow-[0_0_20px_rgba(239,68,68,0.6)]';
        
        // ボスの位置が下に移動したため、吐き出される座標もボスの位置(約30vh + 半径)に調整
        baseX = window.innerWidth / 2 + (Math.random() - 0.5) * 200 - size/2;
        baseY = window.innerHeight * 0.3 + 100; 
        speedY = -((Math.random() * 5 + 3) * (window.innerHeight / 800)); // 下方向へ
        
        let dmg = -20 - (wave - 1) * 3;
        points = Math.min(-5, dmg + skills.immunity * 4); // immunityスキルで軽減
      } else if (typeRoll < goldRate) {
        // ゴールド
        type = 'gold'; face = '◉▽◉'; points = 15; speedMult = 1.8 + (wave - 1) * 0.2;
        colorClass = 'bg-yellow-500/20 border-yellow-400 text-yellow-300 backdrop-blur-sm';
        shadowClass = 'shadow-[0_0_20px_rgba(250,204,21,0.6)]';
      } else if (typeRoll < goldRate + poisonRate) {
        // 毒
        type = 'poison'; face = '◉皿◉'; speedMult = 1.2 + (wave - 1) * 0.1;
        colorClass = 'bg-red-500/20 border-red-500 text-red-400 backdrop-blur-sm';
        shadowClass = 'shadow-[0_0_20px_rgba(239,68,68,0.6)]';
        
        let dmg = -25 - (wave - 1) * 3;
        points = Math.min(-5, dmg + skills.immunity * 4); // immunityスキルで軽減
      }

      const el = document.createElement('div');
      el.className = `saca flex items-center justify-center rounded-full border-2 transition-transform duration-100 ${colorClass} ${shadowClass}`;
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
      el.innerHTML = `<span class="text-xl md:text-2xl font-black tracking-widest pointer-events-none">${face}</span>`;

      // 物理パラメータ
      const swingWidth = Math.random() * 40 + 20;
      const swingSpeed = Math.random() * 0.04 + 0.02;

      const sacaObj = {
        el, type, points, baseX, baseY, currentY: 0, time: Math.random() * 100,
        speedY, swingWidth, swingSpeed, eaten: false, size,
        currentAbsX: 0, currentAbsY: 0
      };

      dom.gameContainer.appendChild(el);
      sacas.push(sacaObj);
    }

    // --- ボス戦管理 ---
    function startBossBattle() {
      gameState = 'boss';
      // WAVEが進むごとにボスのHPが増加
      bossHp = 100 + (wave - 1) * 30; 
      const maxBossHp = bossHp;
      
      dom.waterBg.style.background = 'radial-gradient(circle at 50% 30%, rgba(220, 38, 38, 0.15) 0%, transparent 70%), linear-gradient(180deg, #020617 0%, #450a0a 50%, #020617 100%)';
      flashScreen('rgba(239, 68, 68, 0.5)');
      
      dom.bossHud.classList.remove('hidden');
      dom.bossHpBar.style.width = '100%';
      
      // ボス要素の生成
      const bossEl = document.createElement('div');
      bossEl.id = 'boss-saca';
      // 操作性を高めるため、出現位置を top-32 から 画面の30%の高さ (top-[30vh]) へ引き下げ
      bossEl.className = 'absolute top-[30vh] left-1/2 -translate-x-1/2 flex items-center justify-center rounded-full bg-slate-950 border-4 border-red-600 shadow-[0_0_60px_rgba(220,38,38,0.8)] text-red-500 cursor-crosshair select-none touch-none z-10';
      const bossSize = window.innerWidth < 768 ? 160 : 220;
      bossEl.style.width = `${bossSize}px`;
      bossEl.style.height = `${bossSize}px`;
      bossEl.innerHTML = `<span class="text-6xl md:text-8xl font-black tracking-widest pointer-events-none drop-shadow-[0_0_10px_rgba(239,68,68,1)]">◉▼◉</span>`;
      
      // ボスへのダメージ判定（ボス専用イベント）
      const hitBoss = (e) => {
        e.preventDefault();
        if (gameState !== 'boss') return;
        
        bossHp -= 2.0; 
        fullness = Math.min(100, fullness + 1.5); 
        
        const pos = getPointerPos(e);
        createParticles(pos.x, pos.y, '#ef4444');
        
        // シェイクアニメーション
        const shakeX = (Math.random() - 0.5) * 30;
        const shakeY = (Math.random() - 0.5) * 30;
        bossEl.style.transform = `translate(calc(-50% + ${shakeX}px), ${shakeY}px) scale(0.95)`;
        setTimeout(() => {
          if(bossEl) bossEl.style.transform = 'translate(-50%, 0) scale(1)';
        }, 50);
        
        dom.bossHpBar.style.width = `${Math.max(0, (bossHp / maxBossHp) * 100)}%`;
        
        // ボス撃破
        if (bossHp <= 0) {
          createParticles(window.innerWidth/2, window.innerHeight * 0.3 + 100, '#facc15');
          createParticles(window.innerWidth/2 - 50, window.innerHeight * 0.3 + 50, '#facc15');
          createParticles(window.innerWidth/2 + 50, window.innerHeight * 0.3 + 50, '#facc15');
          bossEl.remove();
          dom.bossHud.classList.add('hidden');
          
          showSkillSelection(); // スキル選択画面へ
        }
      };
      
      bossEl.addEventListener('mousedown', hitBoss);
      bossEl.addEventListener('touchstart', hitBoss, {passive: false});
      
      dom.gameContainer.appendChild(bossEl);
      
      scheduleBossAttack();
    }

    function scheduleBossAttack() {
      if (gameState !== 'boss') return;
      
      // WAVEが進むと一度に吐き出す数が増加
      const count = Math.floor(Math.random() * 3) + 2 + Math.floor(wave / 2);
      for(let i = 0; i < count; i++) {
        spawnSaca(true);
      }
      
      // 攻撃間隔も短縮
      const delay = Math.max(400, 800 - (wave - 1) * 50) + Math.random() * 800;
      bossAttackTimeout = setTimeout(scheduleBossAttack, delay);
    }

    // --- スキル選択画面 ---
    function showSkillSelection() {
      gameState = 'skillSelect';
      clearTimeout(spawnTimeout);
      clearTimeout(bossAttackTimeout);
      dom.waterBg.style.background = ''; // 禍々しい背景を戻す
      
      // 画面上の雑魚サカをクリア
      sacas.forEach(s => { if (s.el.parentNode) s.el.remove(); });
      sacas = [];
      
      dom.skillScreen.classList.remove('hidden');
      
      // スキルをランダムに3つ選出
      const skillKeys = Object.keys(skillData);
      skillKeys.sort(() => 0.5 - Math.random());
      const choices = skillKeys.slice(0, 3);
      
      dom.skillCards.innerHTML = '';
      
      choices.forEach(key => {
        const skill = skillData[key];
        const currentLv = skills[key];
        const card = document.createElement('button');
        card.className = "flex-1 bg-slate-900 border-2 border-cyan-500/50 hover:border-cyan-400 rounded-2xl p-6 text-left transition-all hover:-translate-y-2 hover:shadow-[0_0_20px_rgba(6,182,212,0.4)] group";
        card.innerHTML = `
          <div class="text-4xl mb-4">${skill.icon}</div>
          <h3 class="text-xl md:text-2xl font-black text-cyan-300 mb-2 group-hover:text-cyan-100">${skill.name} <span class="text-yellow-400 text-sm ml-2">レベル ${currentLv} &rarr; ${currentLv + 1}</span></h3>
          <p class="text-slate-300 text-sm md:text-base font-medium">${skill.desc}</p>
        `;
        card.onclick = () => {
          skills[key]++;
          dom.skillScreen.classList.add('hidden');
          wave++;
          startPlaying(false); // 次のウェーブ開始
        };
        dom.skillCards.appendChild(card);
      });
    }


    // --- メインループ ---
    function gameLoop(timestamp) {
      if (gameState !== 'playing' && gameState !== 'boss') return;
      
      const deltaTime = timestamp - lastTime;
      lastTime = timestamp;

      // 満腹度が100に達したらボス戦へ
      if (fullness >= 100 && gameState === 'playing') {
        startBossBattle();
      } else if (fullness > 100) {
        fullness = 100;
      }

      // 満腹度の自然減少計算 (WAVE進行で激しくなるが、digestionスキルで軽減)
      let baseDrain = gameState === 'boss' ? (8.0 + wave) : (4.5 + wave * 0.6);
      baseDrain = Math.max(1.0, baseDrain - skills.digestion * 1.2);
      fullness -= (deltaTime / 1000) * baseDrain;

      // 判定
      if (fullness <= 0) {
        fullness = 0;
        updateHUD();
        endGame();
        return;
      }

      updateHUD();

      // 警告エフェクト (残り15%以下で画面が赤く脈打つ)
      if (fullness <= 15) {
        dom.warningOverlay.classList.add('warning-bg');
      } else {
        dom.warningOverlay.classList.remove('warning-bg');
      }

      // サカバンバスピス更新
      for (let i = sacas.length - 1; i >= 0; i--) {
        const s = sacas[i];
        if (s.eaten) continue;

        s.currentY -= s.speedY;
        s.time += s.swingSpeed;
        const offsetX = Math.sin(s.time) * s.swingWidth;
        
        // 絶対座標を計算して保持（当たり判定用）
        s.currentAbsX = s.baseX + offsetX;
        s.currentAbsY = s.baseY + s.currentY;

        s.el.style.transform = `translate(${s.currentAbsX}px, ${s.currentAbsY}px)`;

        // 画面外へ逃げた場合
        if (s.currentAbsY < -100 || s.currentAbsY > window.innerHeight + 100) {
          if (s.type !== 'poison' && gameState === 'playing') {
            combo = 0; // 毒以外を見逃すとコンボリセット
          }
          if (s.el.parentNode) s.el.remove();
          sacas.splice(i, 1);
        }
      }

      gameLoopId = requestAnimationFrame(gameLoop);
    }

    // --- 当たり判定処理 ---
    function checkCatch(clientX, clientY) {
      if (gameState !== 'playing' && gameState !== 'boss') return;
      
      // スキル「吸引力アップ」で当たり判定の円が広がる
      const catchRadius = 5 + skills.magnet * 10; 
      
      for (let i = sacas.length - 1; i >= 0; i--) {
        const s = sacas[i];
        if (s.eaten) continue;
        
        // 中心座標
        const centerX = s.currentAbsX + s.size / 2;
        const centerY = s.currentAbsY + s.size / 2;
        
        const dx = clientX - centerX;
        const dy = clientY - centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        // サカバンバスピスの半径(size/2) + 吸引範囲(catchRadius)
        if (dist <= catchRadius + (s.size / 2)) {
          s.eaten = true;
          handleEat(s, clientX, clientY);
        }
      }
    }

    // --- 捕食インタラクション処理 ---
    function handleEat(sacaObj, x, y) {
      if (sacaObj.type === 'poison') {
        fullness = Math.max(0, fullness + sacaObj.points);
        combo = 0;
        createParticles(x, y, '#ef4444');
        flashScreen('rgba(239, 68, 68, 0.4)');
        showFloatingText(x, y, `満腹度減少`, 'text-red-500');
      } else {
        combo++;
        const comboBonus = Math.min(combo * 0.5, 5); // コンボボーナス
        const totalPoints = sacaObj.points + comboBonus;
        fullness += totalPoints; 
        
        const pColor = sacaObj.type === 'gold' ? '#facc15' : '#06b6d4';
        const tColor = sacaObj.type === 'gold' ? 'text-yellow-300' : 'text-cyan-300';
        
        createParticles(x, y, pColor);
        showFloatingText(x, y, `+${totalPoints.toFixed(1)}%`, tColor);
      }

      // 捕食アニメーション
      sacaObj.el.style.transition = 'transform 0.15s cubic-bezier(0.6, -0.28, 0.735, 0.045), opacity 0.15s';
      sacaObj.el.style.transform = `${sacaObj.el.style.transform} scale(0)`;
      sacaObj.el.style.opacity = '0';
      
      setTimeout(() => {
        if(sacaObj.el.parentNode) sacaObj.el.remove();
        sacas = sacas.filter(s => s !== sacaObj);
      }, 150);
    }

    // --- 視覚エフェクト ---
    function createParticles(x, y, color) {
      const count = 10;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 8 + 4;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.backgroundColor = color;
        p.style.boxShadow = `0 0 10px ${color}`;
        p.style.left = `${x - size/2}px`;
        p.style.top = `${y - size/2}px`;
        
        const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.5);
        const distance = Math.random() * 60 + 40;
        p.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
        
        dom.particleContainer.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    function showFloatingText(x, y, text, colorClass) {
      const el = document.createElement('div');
      el.textContent = text;
      el.className = `absolute text-xl md:text-2xl font-black font-mono pointer-events-none drop-shadow-[0_0_5px_rgba(0,0,0,0.8)] ${colorClass}`;
      el.style.left = `${x - 20}px`;
      el.style.top = `${y - 20}px`;
      el.style.transition = 'transform 0.8s ease-out, opacity 0.8s ease-out';
      
      dom.particleContainer.appendChild(el);
      
      // リフローを強制してアニメーション開始
      void el.offsetWidth;
      el.style.transform = 'translateY(-50px) scale(1.2)';
      el.style.opacity = '0';
      
      setTimeout(() => el.remove(), 800);
    }

    function flashScreen(color) {
      const flash = document.createElement('div');
      flash.className = 'absolute inset-0 z-40 pointer-events-none opacity-0';
      flash.style.backgroundColor = color;
      flash.style.transition = 'opacity 0.1s ease-out';
      document.body.appendChild(flash);
      
      void flash.offsetWidth;
      flash.style.opacity = '1';
      
      setTimeout(() => {
        flash.style.transition = 'opacity 0.3s ease-in';
        flash.style.opacity = '0';
        setTimeout(() => flash.remove(), 300);
      }, 50);
    }

    function updateHUD() {
      // ゲージのUI更新
      dom.fullnessBar.style.width = `${Math.min(100, fullness)}%`;
      dom.fullnessText.textContent = `${Math.floor(fullness)}%`;
      
      // ゲージの色を状態に応じて変える
      if (fullness <= 20) {
        dom.fullnessBar.style.background = 'linear-gradient(90deg, #ef4444, #f97316)'; // ピンチ (赤)
      } else if (fullness >= 80) {
        dom.fullnessBar.style.background = 'linear-gradient(90deg, #10b981, #34d399)'; // もうすぐクリア (緑)
      } else {
        dom.fullnessBar.style.background = 'linear-gradient(90deg, #06b6d4, #3b82f6)'; // 通常 (青)
      }

      // コンボ表示
      if (combo >= 2) {
        dom.combo.textContent = `${combo} 連続捕食！`;
        dom.combo.style.opacity = '1';
        dom.combo.style.transform = 'scale(1.3) rotate(-5deg)';
        setTimeout(() => dom.combo.style.transform = 'scale(1) rotate(0)', 150);
      } else {
        dom.combo.style.opacity = '0';
      }
    }

    // --- 入力（スワイプ/タップ）イベント管理 ---
    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      const pos = getPointerPos(e);
      checkCatch(pos.x, pos.y);
    });
    window.addEventListener('mouseup', () => isDragging = false);
    
    window.addEventListener('touchstart', (e) => {
      isDragging = true;
      const pos = getPointerPos(e);
      checkCatch(pos.x, pos.y);
    });
    window.addEventListener('touchend', () => isDragging = false);

    function handlePointerMove(e) {
      if (!isDragging) return;
      if (e.type === 'touchmove' && e.target.closest('#game-container')) {
        e.preventDefault(); // スクロール防止
      }
      const pos = getPointerPos(e);
      checkCatch(pos.x, pos.y);
    }
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', handlePointerMove, {passive: false});

    // --- イベントリスナー ---
    dom.btnStart.addEventListener('click', startGameSequence);
    dom.btnRetry.addEventListener('click', startGameSequence);

    // 初期化
    window.onload = initBubbles;
  </script>
</body>
</html>
